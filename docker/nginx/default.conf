map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream octane {
  server app:8000;
}

server {
  listen 80;
  server_name localhost;
  root /var/www/html/public;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml font/truetype application/vnd.ms-fontobject image/svg+xml;

  charset utf-8;
  client_max_body_size 100m;

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt { access_log off; log_not_found off; }

  # Served straight from disk so a static asset never occupies an Octane worker.
  location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|woff2|ttf|eot)$ {
    access_log off;
    log_not_found off;
    expires 30d;
    try_files $uri =404;
  }

  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Everything else is proxied to Octane. There is no PHP-FPM upstream and no
  # index.php on disk to fall back to: Swoole owns routing now.
  location / {
    try_files $uri @octane;
  }

  location @octane {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300;
    proxy_pass http://octane;
  }

  access_log /var/log/nginx/boilerplate_access.log;
  error_log /var/log/nginx/boilerplate_error.log;
}
